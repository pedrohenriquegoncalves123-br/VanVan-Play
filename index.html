<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Run - Dynamic Universe</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap');

        :root {
            --bg-top: #4facfe;
            --bg-bottom: #00f2fe;
            --text-color: #fff;
            --ground-top: #2ecc71;
            --ground-bottom: #27ae60;
        }

        body.night {
            --bg-top: #0a0b10;
            --bg-bottom: #1a1a2e;
            --text-color: #f1c40f;
            --ground-top: #1f2a38;
            --ground-bottom: #0f1620;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
            font-family: 'Fredoka', sans-serif;
            overflow: hidden;
            transition: background 1.5s ease;
        }

        #game-container {
            width: 900px;
            height: 380px;
            position: relative;
            background: linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            border: 4px solid rgba(255, 255, 255, 0.2);
            transition: background 1.5s ease;
        }

        /*=========================================
           CÉU NOTURNO GERADO VIA JS
        =========================================*/
        #night-sky {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease;
            z-index: 0;
            pointer-events: none;
        }

        body.night #night-sky {
            opacity: 1;
        }

        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px #fff, 0 0 15px rgba(255, 255, 255, 0.8);
            animation: twinkle 2s infinite ease-in-out alternate;
        }

        @keyframes twinkle {
            0% {
                opacity: 0.3;
                transform: scale(0.8);
            }

            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        #celestial {
            position: absolute;
            top: 40px;
            right: 120px;
            font-size: 70px;
            color: #f1c40f;
            filter: drop-shadow(0 0 25px rgba(241, 196, 15, 0.9));
            transition: all 1.5s ease;
            z-index: 1;
        }

        body.night #celestial {
            color: #f5f6fa;
            filter: drop-shadow(0 0 25px rgba(245, 246, 250, 0.8));
            transform: rotate(-45deg) scale(1.1);
        }

        /*=========================================
           CENÁRIO BÁSICO E PERSONAGEM
        =========================================*/
        #ground {
            position: absolute;
            bottom: 0;
            width: 2000%;
            height: 50px;
            background: linear-gradient(to bottom, var(--ground-top), var(--ground-bottom));
            z-index: 2;
            box-shadow: inset 0 5px 15px rgba(0, 0, 0, 0.15);
            transition: background 1.5s ease;
        }

        #ground::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background-color: rgba(0, 0, 0, 0.2);
        }

        .cloud {
            position: absolute;
            color: rgba(255, 255, 255, 0.8);
            filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.1));
            z-index: 1;
            transition: color 1.5s ease;
        }

        body.night .cloud {
            color: rgba(255, 255, 255, 0.1);
        }

        #dino {
            position: absolute;
            bottom: 45px;
            left: 80px;
            z-index: 3;
            color: #ff5722;
            font-size: 60px;
            filter: drop-shadow(3px 5px 5px rgba(0, 0, 0, 0.4));
            transition: transform 0.15s ease;
        }

        @keyframes run-anim {
            0% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-5px) rotate(5deg);
            }

            100% {
                transform: translateY(0) rotate(0deg);
            }
        }

        #dino.running {
            animation: run-anim 0.3s infinite;
        }

        #dino.ducking {
            transform: translateY(20px) scaleY(0.6) rotate(15deg) !important;
            color: #e64a19;
        }

        /*=========================================
           OBSTÁCULOS COM NOVAS ANIMAÇÕES
        =========================================*/
        .obstacle {
            position: absolute;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            filter: drop-shadow(3px 6px 5px rgba(0, 0, 0, 0.4));
        }

        /* Foguete */
        .fly-wrapper {
            animation: float-rocket 0.6s infinite ease-in-out alternate;
        }

        .rocket-icon {
            color: #e74c3c;
            font-size: 45px;
            transform: scaleX(-1) rotate(45deg);
            transition: color 1.5s ease;
        }

        body.night .rocket-icon {
            color: #f39c12;
            filter: drop-shadow(0 0 10px rgba(243, 156, 18, 0.8));
        }

        @keyframes float-rocket {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-20px);
            }
        }

        /* Fogo */
        .fire-wrapper {
            animation: flicker 0.3s infinite alternate;
        }

        @keyframes flicker {
            0% {
                transform: scale(1) skewX(-2deg);
                opacity: 0.9;
            }

            100% {
                transform: scale(1.1) skewX(2deg);
                opacity: 1;
            }
        }

        /* Fantasma */
        .ghost-wrapper {
            animation: ghost-float 1s infinite ease-in-out alternate;
        }

        @keyframes ghost-float {
            0% {
                transform: translateY(0) rotate(-5deg);
            }

            100% {
                transform: translateY(-15px) rotate(5deg);
            }
        }

        /*=========================================
           INTERFACE
        =========================================*/
        #pause-btn {
            position: absolute;
            top: 20px;
            left: 25px;
            font-size: 20px;
            color: var(--text-color);
            background: rgba(0, 0, 0, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.3);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }

        #pause-btn:hover {
            transform: scale(1.1);
            background: rgba(0, 0, 0, 0.4);
        }

        #score-board {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 26px;
            color: var(--text-color);
            font-weight: 700;
            letter-spacing: 2px;
            z-index: 10;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
            transition: color 1.5s ease;
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            z-index: 20;
            color: #fff;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px 50px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        #game-over h1 {
            margin: 0 0 15px 0;
            font-size: 40px;
            color: #e74c3c;
            text-shadow: 2px 2px 0 #c0392b;
        }

        .restart-btn {
            font-size: 20px;
            background-color: #f1c40f;
            color: #2c3e50;
            padding: 12px 35px;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 700;
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.4);
            transition: all 0.2s;
            border: none;
            display: inline-block;
        }

        .restart-btn:hover {
            transform: scale(1.1);
            background-color: #f39c12;
        }
    </style>
</head>

<body>

    <div id="game-container">
        <!-- Botão de Pausa no lado esquerdo superior -->
        <div id="pause-btn" title="Pausar Jogo (P)"><i class="fa-solid fa-pause"></i></div>

        <!-- O céu noturno -->
        <div id="night-sky"></div>

        <i id="celestial" class="fa-solid fa-sun"></i>

        <div id="score-board">
            HI: <span id="hi-score">00000</span> &nbsp;|&nbsp; <i class="fa-solid fa-trophy"></i> <span
                id="score">00000</span>
        </div>

        <div id="game-over">
            <h1><i class="fa-solid fa-skull"></i> FIM DE JOGO</h1>
            <div class="restart-btn"><i class="fa-solid fa-rotate-right"></i> RECOMEÇAR</div>
        </div>

        <i id="dino" class="fa-solid fa-dragon running"></i>
        <div id="ground"></div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const ground = document.getElementById('ground');
        const dino = document.getElementById('dino');
        const celestial = document.getElementById('celestial');
        const nightSky = document.getElementById('night-sky');
        const scoreElement = document.getElementById('score');
        const hiScoreElement = document.getElementById('hi-score');
        const gameOverScreen = document.getElementById('game-over');
        const pauseBtn = document.getElementById('pause-btn');

        let isJumping = false; let isDucking = false; let isGameOver = false; let isPaused = false;
        let score = 0; let isNight = false;
        let hiScore = localStorage.getItem('dragonRunGalaxy') || 0;

        function formatScore(num) { return Math.floor(num).toString().padStart(5, '0'); }
        hiScoreElement.innerText = formatScore(hiScore);

        let baseGameSpeed = 7.5;
        let obstacles = []; let clouds = [];
        let frames = 0; let nextSpawnFrame = 60;

        let dinoBottom = 45; let gravity = 1.1; let velocity = 0; const jumpPower = 18.5;
        let animationId; let groundPos = 0;

        function createStars() {
            nightSky.innerHTML = '';
            for (let i = 0; i < 40; i++) {
                let star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 70 + '%';
                let size = Math.random() * 3 + 1;
                star.style.width = size + 'px'; star.style.height = size + 'px';
                star.style.animationDelay = (Math.random() * 2) + 's';
                nightSky.appendChild(star);
            }
        }

        createStars();

        function togglePause() {
            if (isGameOver) return;
            isPaused = !isPaused;

            if (isPaused) {
                cancelAnimationFrame(animationId);
                pauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
                dino.classList.remove('running');
            } else {
                pauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                if (!isJumping && !isDucking) dino.classList.add('running');
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        function jump() {
            if (isGameOver) { resetGame(); return; }
            if (isPaused) return;
            if (!isJumping && !isDucking) {
                isJumping = true; velocity = jumpPower; dino.classList.remove('running');
            }
        }

        function duck(active) {
            if (isGameOver || isJumping || isPaused) return;
            isDucking = active;
            if (isDucking) {
                dino.classList.add('ducking'); dino.classList.remove('running');
            } else {
                dino.classList.remove('ducking'); dino.classList.add('running');
            }
        }

        function spawnObstacle() {
            const obstacle = document.createElement('div');
            obstacle.classList.add('obstacle');

            let r = Math.random();
            let width, height, bottom;
            let iconHTML = '';

            if (r < 0.20) {
                width = 30; height = 45; bottom = 45;
                iconHTML = `<i class="fa-solid fa-tree" style="color: #16a085; font-size: 50px;"></i>`;
            } else if (r < 0.40) {
                width = 30; height = 35; bottom = 45;
                iconHTML = `<div class="fire-wrapper"><i class="fa-solid fa-fire" style="color: #e74c3c; font-size: 45px;"></i></div>`;
            } else if (r < 0.60) {
                width = 50; height = 55; bottom = 45;
                iconHTML = `<i class="fa-solid fa-mountain" style="color: #7f8c8d; font-size: 60px;"></i>`;
            } else if (r < 0.80) {
                if (isNight) {
                    width = 35; height = 40; bottom = 55 + (Math.random() * 20);
                    iconHTML = `<div class="ghost-wrapper"><i class="fa-solid fa-ghost" style="color: #ecf0f1; font-size: 45px; opacity: 0.9;"></i></div>`;
                } else {
                    width = 40; height = 35; bottom = 45;
                    iconHTML = `<i class="fa-solid fa-meteor" style="color: #d35400; font-size: 45px; transform: scaleX(-1);"></i>`;
                }
            } else {
                const isHigh = Math.random() > 0.5;
                width = 45; height = 40; bottom = isHigh ? 130 : 60;
                iconHTML = `
                    <div class="fly-wrapper">
                        <i class="fa-solid fa-rocket rocket-icon"></i>
                    </div>`;
            }

            obstacle.style.width = width + 'px'; obstacle.style.height = height + 'px';
            obstacle.style.left = '900px'; obstacle.style.bottom = bottom + 'px';
            obstacle.innerHTML = iconHTML;

            obstacle.dataset.width = width; obstacle.dataset.height = height; obstacle.dataset.bottom = bottom;
            container.appendChild(obstacle); obstacles.push({ element: obstacle, x: 900 });
        }

        function spawnCloud() {
            const cloud = document.createElement('i');
            cloud.className = 'fa-solid fa-cloud cloud';
            cloud.style.fontSize = (Math.random() * 50 + 30) + 'px';
            cloud.style.left = '900px'; cloud.style.top = (Math.random() * 150 + 20) + 'px';
            container.appendChild(cloud); clouds.push({ element: cloud, x: 900, speed: (Math.random() * 0.4) + 0.1 });
        }

        function resetGame() {
            isGameOver = false; isPaused = false; score = 0; baseGameSpeed = 7.5;
            dinoBottom = 45; velocity = 0;
            isJumping = false; isDucking = false; frames = 0; nextSpawnFrame = 60;

            pauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            document.body.classList.remove('night'); isNight = false;
            celestial.className = 'fa-solid fa-sun';

            dino.classList.remove('ducking'); dino.classList.add('running');

            obstacles.forEach(obs => obs.element.remove()); obstacles = [];
            clouds.forEach(c => c.element.remove()); clouds = [];

            gameOverScreen.style.display = 'none';

            for (let i = 0; i < 4; i++) {
                spawnCloud(); clouds[i].x = Math.random() * 800; clouds[i].element.style.left = clouds[i].x + 'px';
            }
            gameLoop();
        }

        function updatePhysics() {
            if (isJumping) {
                dinoBottom += velocity; velocity -= gravity;
                if (dinoBottom <= 45) {
                    dinoBottom = 45; isJumping = false; velocity = 0;
                    if (!isDucking) dino.classList.add('running');
                }
            }
            dino.style.bottom = dinoBottom + 'px';
        }

        function updateEntities(activeSpeed) {
            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.x -= activeSpeed;
                obs.element.style.left = obs.x + 'px';

                let dinoHitbox = {
                    left: 80 + 10, right: 80 + 55,
                    bottom: dinoBottom + 5, top: dinoBottom + (isDucking ? 35 : 55)
                };
                let obsHitbox = {
                    left: obs.x + 8, right: obs.x + parseInt(obs.element.dataset.width) - 8,
                    bottom: parseInt(obs.element.dataset.bottom) + 5, top: parseInt(obs.element.dataset.bottom) + parseInt(obs.element.dataset.height) - 5
                };

                if (dinoHitbox.right > obsHitbox.left && dinoHitbox.left < obsHitbox.right &&
                    dinoHitbox.top > obsHitbox.bottom && dinoHitbox.bottom < obsHitbox.top) {
                    endGame();
                }

                if (obs.x < -100) { obs.element.remove(); obstacles.splice(i, 1); i--; }
            }

            for (let i = 0; i < clouds.length; i++) {
                clouds[i].x -= activeSpeed * clouds[i].speed;
                clouds[i].element.style.left = clouds[i].x + 'px';
                if (clouds[i].x < -150) { clouds[i].element.remove(); clouds.splice(i, 1); i--; }
            }
        }

        function endGame() {
            isGameOver = true; gameOverScreen.style.display = 'block'; dino.classList.remove('running');
            cancelAnimationFrame(animationId);
            if (score > hiScore) {
                hiScore = score; localStorage.setItem('dragonRunGalaxy', hiScore);
                hiScoreElement.innerText = formatScore(hiScore);
            }
        }

        function gameLoop() {
            if (isGameOver || isPaused) return;

            let activeSpeed = isNight ? baseGameSpeed * 1.25 : baseGameSpeed;

            groundPos -= activeSpeed;
            ground.style.backgroundPosition = `${groundPos}px 0`;

            updatePhysics();
            updateEntities(activeSpeed);

            score += 0.08;
            scoreElement.innerText = formatScore(score);

            let currentIsNight = Math.floor(score / 20) % 2 !== 0;

            if (currentIsNight && !isNight) {
                isNight = true;
                document.body.classList.add('night'); celestial.className = 'fa-solid fa-moon';
            } else if (!currentIsNight && isNight) {
                isNight = false;
                document.body.classList.remove('night'); celestial.className = 'fa-solid fa-sun';
            }

            if (frames % 400 === 0 && baseGameSpeed < 18) { baseGameSpeed += 0.4; }

            frames++;

            if (frames >= nextSpawnFrame) {
                spawnObstacle();
                let minSpace = isNight ? 45 : 60;
                let maxSpace = isNight ? 90 : 130;
                if (baseGameSpeed > 10) { minSpace -= 10; maxSpace -= 20; }
                nextSpawnFrame = frames + Math.floor(Math.random() * (maxSpace - minSpace)) + minSpace;
            }

            if (Math.random() < 0.015 && clouds.length < 6) { spawnCloud(); }

            animationId = requestAnimationFrame(gameLoop);
        }

        // Eventos de clique e toque do botão de pausa
        pauseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            togglePause();
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyP' || e.code === 'Escape') {
                togglePause();
                return;
            }
            if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
            if (e.code === 'ArrowDown') { e.preventDefault(); duck(true); }
        });

        document.addEventListener('keyup', (e) => { if (e.code === 'ArrowDown') duck(false); });

        container.addEventListener('touchstart', (e) => {
            if (e.target.closest('.restart-btn') || e.target.closest('#pause-btn')) return;
            e.preventDefault();
            const touchY = e.touches[0].clientY;
            const centerY = container.getBoundingClientRect().top + (container.getBoundingClientRect().height / 2);
            if (touchY > centerY) duck(true); else jump();
        }, { passive: false });

        container.addEventListener('touchend', (e) => {
            if (e.target.closest('.restart-btn') || e.target.closest('#pause-btn')) return;
            duck(false);
        });

        document.querySelector('.restart-btn').addEventListener('click', jump);

        for (let i = 0; i < 4; i++) { spawnCloud(); clouds[i].x = Math.random() * 800; clouds[i].element.style.left = clouds[i].x + 'px'; }
        createStars();
        gameLoop();
    </script>
</body>

</html>
